<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiro Proxy</title>
    <meta
      name="description"
      content="Admin panel for Kiro Proxy: turn Kiro accounts into an OpenAI- and Anthropic-compatible API."
    />
    <!-- A self-hosted admin panel: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="application-name" content="Kiro Proxy" />
    <meta name="apple-mobile-web-app-title" content="Kiro Proxy" />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome follows the page (index.css --background): zinc-50 in light, near-black in dark. -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)" />
    <!-- Link previews (chat apps, social). No og:image: the panel's own host is not known here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kiro Proxy" />
    <meta property="og:title" content="Kiro Proxy" />
    <meta
      property="og:description"
      content="Turn Kiro accounts into an OpenAI- and Anthropic-compatible API."
    />
    <meta name="twitter:card" content="summary" />
    <!-- Icons: the multi-size .ico (16-256 px) for tabs, PNGs for touch screens and installs. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Pre-paint boot: apply theme and language before CSS loads, so there is no flash.
      (() => {
        const root = document.documentElement;
        const read = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const storedTheme = read("kiro_theme");
        const theme =
          storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
            ? storedTheme
            : "system";
        let dark = theme === "dark";
        if (theme === "system") {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {
            dark = false;
          }
        }
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        // Mirrors getInitialLang and matchLang in src/lib/i18n (boot-script.test.ts keeps
        // them in step): the stored language, else the first supported navigator language.
        const matchLang = (tag) => {
          const lower = String(tag || "").toLowerCase();
          if (lower.startsWith("zh")) return "zh";
          if (lower.startsWith("vi")) return "vi";
          if (lower.startsWith("pt")) return "pt-BR";
          if (lower.startsWith("en")) return "en";
          return undefined;
        };
        const storedLang = read("kiro_lang");
        let lang = ["en", "zh", "vi", "pt-BR"].includes(storedLang)
          ? storedLang
          : storedLang === "pseudo" // the dev-only pseudo language renders as English
            ? "en"
            : undefined;
        if (!lang) {
          const preferred = navigator.languages?.length ? navigator.languages : [navigator.language];
          for (const tag of preferred) {
            lang = matchLang(tag);
            if (lang) break;
          }
        }
        root.lang = lang || "en";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
