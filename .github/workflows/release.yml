name: Release

# A push to main whose version.json names a version with no tag yet builds the binaries, creates
# that tag (the bare version, such as 3.3.0) and its GitHub Release, and starts the Docker build for
# the tag. A version tag pushed by hand publishes the same way. Run the workflow by hand (Actions > Release > Run workflow) for a
# dry run: it builds, smoke-tests and keeps the archives as a workflow artifact, and publishes nothing.
on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v*']
  workflow_dispatch:

permissions:
  contents: read

# A second run for the same tag waits for the first instead of cancelling a half-done upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# bash -eo pipefail: a failing command anywhere in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Decides the tag and whether to publish. A main push whose version is already tagged stops here.
  # Also picks the Go versions every later job builds and tests with.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      go: ${{ steps.go.outputs.version }}
      tunnel-go: ${{ steps.tunnel-go.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pick tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(jq -r .version version.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version.json version '$version' is not a semantic version"
            exit 1
          fi
          tag="$version"
          publish=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            publish=true
          elif [ "$EVENT" = push ]; then
            # A release from before tags dropped the v prefix still counts.
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1 ||
              gh api "repos/$GH_REPO/git/ref/tags/v$tag" >/dev/null 2>&1; then
              echo "$tag is already tagged; nothing to release."
            else
              echo "$tag has no tag yet; releasing it."
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # go.mod says `go 1.25.0`, and go-version-file would install exactly that patch. Build with
      # the newest patch of the go.mod minor instead, as the Docker image's golang:1.25 tag does,
      # so the published binaries get the latest stdlib security fixes.
      - name: Pick Go version
        id: go
        run: |
          minor="$(awk '$1 == "go" { split($2, v, "."); print v[1] "." v[2]; exit }' go.mod)"
          if ! [[ "$minor" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read the go directive from go.mod"
            exit 1
          fi
          echo "version=$minor.x" >> "$GITHUB_OUTPUT"

      # The public-link helper (helper/kiro-tunnel) is its own module and needs the newer Go that
      # Tailscale asks for. Build it with the newest patch of its go.mod minor; fall back to the
      # exact go.mod version when go.dev no longer lists that minor.
      - name: Pick the helper's Go version
        id: tunnel-go
        run: |
          exact="$(awk '$1 == "go" { print $2; exit }' helper/kiro-tunnel/go.mod)"
          minor="$(echo "$exact" | cut -d. -f1,2)"
          latest="$(curl -fsS 'https://go.dev/dl/?mode=json' |
            jq -r --arg p "go$minor." '[.[] | select(.stable) | .version | select(startswith($p))][0] // empty' || true)"
          version="${latest:-go$exact}"
          echo "version=${version#go}" >> "$GITHUB_OUTPUT"
          echo "helper toolchain: $version"

  # The admin UI, built once: every binary embeds this same ui/dist. It needs nothing from plan, so
  # it runs beside it.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the UI
        uses: ./.github/actions/setup-ui

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Upload UI
        uses: actions/upload-artifact@v7
        with:
          name: release-ui-dist
          path: ui/dist
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # One job per platform, all at once: each builds the helper and kiro-proxy for its platform.
  build:
    needs: [plan, ui]
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.plan.outputs.go }}
          check-latest: true
          # The cache below also holds the helper's toolchain and this platform's compiled packages.
          cache: false

      - name: Show Go version
        run: go version

      - name: Name the platform
        id: platform
        env:
          TARGET: ${{ matrix.target }}
        run: echo "name=${TARGET//\//-}" >> "$GITHUB_OUTPUT"

      # Tailscale makes the helper the slow part of a cold build. Its compiled packages depend on the
      # platform, the two toolchains and the two go.sum files, which the key names, so a version
      # bump that changes neither reuses them.
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-go-${{ steps.platform.outputs.name }}-go${{ steps.go.outputs.go-version }}-go${{ needs.plan.outputs.tunnel-go }}-${{ hashFiles('go.sum', 'helper/kiro-tunnel/go.sum') }}
          # A changed go.sum or toolchain starts from the newest cache of this platform.
          restore-keys: release-go-${{ steps.platform.outputs.name }}-

      - name: Download UI
        uses: actions/download-artifact@v8
        with:
          name: release-ui-dist
          path: ui/dist

      - name: Build binaries
        env:
          TUNNEL_GOTOOLCHAIN: go${{ needs.plan.outputs.tunnel-go }}
        run: .github/scripts/build-release.sh "$RUNNER_TEMP/release" "${{ matrix.target }}"

      - name: Save Go build cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # Run the linux-x64 binary straight from its archive and check that it serves the admin UI
      # and reports the release version. The server log is printed only on failure.
      - name: Smoke test linux-x64 binary
        if: matrix.target == 'linux/amd64'
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "$RUNNER_TEMP/release/kiro-proxy-linux-x64.tar.gz" -C "$smoke"
          DATA_DIR="$smoke/state" "$smoke/kiro-proxy-linux-x64/kiro-proxy" >"$smoke/server.log" 2>&1 &
          pid=$!
          stop() {
            status=$?
            kill "$pid" 2>/dev/null || true
            [ "$status" -eq 0 ] || cat "$smoke/server.log"
          }
          trap stop EXIT
          .github/scripts/admin-ui-smoke.sh http://127.0.0.1:8080
          want="$(jq -r .version version.json)"
          got="$(curl -fsS http://127.0.0.1:8080/health | jq -r .version)"
          if [ "$got" != "$want" ]; then
            echo "::error::The binary reports version $got, version.json says $want"
            exit 1
          fi
          # The helper starts and speaks the protocol this proxy expects.
          gunzip -c "$RUNNER_TEMP/release/kiro-tunnel-linux-x64.gz" >"$smoke/kiro-tunnel"
          chmod 0755 "$smoke/kiro-tunnel"
          "$smoke/kiro-tunnel" version | tee /dev/stderr | grep -q "kiro-tunnel $want (protocol 1)"

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ steps.platform.outputs.name }}
          path: ${{ runner.temp }}/release
          retention-days: 1
          if-no-files-found: error
          # The archives are compressed already.
          compression-level: 0

  # A main push can release before CI on the same commit finishes, so the Go tests run here too,
  # beside the builds, split as in CI. Each test runs in exactly one shard.
  test-go:
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    name: Test Go (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.plan.outputs.go }}
          check-latest: true

      # The binary reports config.Version, compiled from source as in the Docker image. Refuse a
      # tag that names another version, and keep version.json equal to config.Version.
      - name: Check version
        if: matrix.shard == 1
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="$(jq -r .version version.json)"
          if [ "$EVENT" = push ]; then
            base="${TAG#v}"
            base="${base%%-*}"
            if [ "$base" != "$version" ]; then
              echo "::error::Tag $TAG does not match version.json version $version"
              exit 1
            fi
          fi
          go test ./config/ -run '^TestVersionMatchesUpdateManifest$'

      - name: Test Go
        run: .github/scripts/go-test-shard.sh ${{ matrix.shard }} 2

  test-helper:
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    name: Test tunnel helper
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.plan.outputs.tunnel-go }}
          cache-dependency-path: helper/kiro-tunnel/go.sum

      - name: Test tunnel helper
        working-directory: helper/kiro-tunnel
        run: go test ./...

  # Gathers the six platforms' files into one artifact with their checksums. A dry run stops here.
  collect:
    needs: [build, test-go, test-helper]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Write checksums
        working-directory: ${{ runner.temp }}/release
        run: |
          shopt -s nullglob
          assets=(kiro-proxy-* kiro-tunnel-*)
          if [ "${#assets[@]}" -ne 12 ]; then
            echo "::error::Expected 6 archives and 6 helpers, found ${#assets[@]} files"
            ls -l
            exit 1
          fi
          sha256sum "${assets[@]}" >SHA256SUMS.txt
          ls -l

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: kiro-proxy-binaries
          path: ${{ runner.temp }}/release
          retention-days: 7
          if-no-files-found: error
          # The archives are compressed already.
          compression-level: 0

  publish:
    needs: [plan, collect]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A main push and a hand-pushed tag for one version publish one after the other.
    concurrency:
      group: release-publish-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: kiro-proxy-binaries
          path: ${{ runner.temp }}/release

      # A first run creates the release with the changelog from version.json. A re-run replaces
      # the assets and leaves the notes alone, in case they were edited on GitHub since.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/release/kiro-proxy-* "$RUNNER_TEMP"/release/kiro-tunnel-* "$RUNNER_TEMP/release/SHA256SUMS.txt")
          if [ "${#assets[@]}" -ne 13 ]; then
            echo "::error::Expected 6 archives, 6 helpers and SHA256SUMS.txt, found ${#assets[@]} files"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi

          notes="$RUNNER_TEMP/notes.md"
          {
            jq -r '.changelog | split("\n") | map(select(length > 0) | "- " + .) | .[]' version.json
            echo
            echo "Check a download against the checksums with \`sha256sum -c SHA256SUMS.txt --ignore-missing\` (macOS: \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`)."
            echo
            echo "Docker image: \`ghcr.io/${GH_REPO,,}:${TAG#v}\`"
          } >"$notes"

          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if [ "$REF_TYPE" = tag ]; then
            flags+=(--verify-tag)
          else
            # The release creates the tag on the commit that was built.
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${assets[@]}" --title "Kiro Proxy $TAG" \
            --notes-file "$notes" "${flags[@]}"

          # A tag made with GITHUB_TOKEN starts no workflow, so start the Docker build for it here;
          # its semver rules read the tag ref and push the <version> and <major>.<minor> images.
          if [ "$REF_TYPE" != tag ]; then
            gh workflow run docker.yml --ref "$TAG"
          fi
