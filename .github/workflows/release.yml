name: Release

# A push to main whose version.json names a version with no tag yet builds the binaries, creates
# that tag (the bare version, such as 3.3.0) and its GitHub Release, and starts the Docker build for
# the tag. A version tag pushed by hand publishes the same way. Run the workflow by hand (Actions > Release > Run workflow) for a
# dry run: it builds, smoke-tests and keeps the archives as a workflow artifact, and publishes nothing.
on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v*']
  workflow_dispatch:

permissions:
  contents: read

# A second run for the same tag waits for the first instead of cancelling a half-done upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# bash -eo pipefail: a failing command anywhere in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Decides the tag and whether to publish. A main push whose version is already tagged stops here.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pick tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(jq -r .version version.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version.json version '$version' is not a semantic version"
            exit 1
          fi
          tag="$version"
          publish=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            publish=true
          elif [ "$EVENT" = push ]; then
            # A release from before tags dropped the v prefix still counts.
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1 ||
              gh api "repos/$GH_REPO/git/ref/tags/v$tag" >/dev/null 2>&1; then
              echo "$tag is already tagged; nothing to release."
            else
              echo "$tag has no tag yet; releasing it."
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # go.mod says `go 1.25.0`, and go-version-file would install exactly that patch. Build with
      # the newest patch of the go.mod minor instead, as the Docker image's golang:1.25 tag does,
      # so the published binaries get the latest stdlib security fixes.
      - name: Pick Go version
        id: go
        run: |
          minor="$(awk '$1 == "go" { split($2, v, "."); print v[1] "." v[2]; exit }' go.mod)"
          if ! [[ "$minor" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read the go directive from go.mod"
            exit 1
          fi
          echo "version=$minor.x" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true

      - name: Show Go version
        run: go version

      # The binary reports config.Version, compiled from source as in the Docker image. Refuse a
      # tag that names another version, and keep version.json equal to config.Version.
      - name: Check version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="$(jq -r .version version.json)"
          if [ "$EVENT" = push ]; then
            base="${TAG#v}"
            base="${base%%-*}"
            if [ "$base" != "$version" ]; then
              echo "::error::Tag $TAG does not match version.json version $version"
              exit 1
            fi
          fi
          go test ./config/ -run '^TestVersionMatchesUpdateManifest$'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # The pnpm version comes from the packageManager field; there is no root package.json.
          package_json_file: ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Build the UI once; every binary embeds the same ui/dist.
      - name: Build UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # A main push can release before CI on the same commit finishes, so the Go tests run here too.
      - name: Test Go
        run: go test ./...

      - name: Build binaries
        run: .github/scripts/build-release.sh "$RUNNER_TEMP/release"

      # Run the linux-x64 binary straight from its archive and check that it serves the admin UI
      # and reports the release version. The server log is printed only on failure.
      - name: Smoke test linux-x64 binary
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "$RUNNER_TEMP/release/kiro-proxy-linux-x64.tar.gz" -C "$smoke"
          DATA_DIR="$smoke/state" "$smoke/kiro-proxy-linux-x64/kiro-proxy" >"$smoke/server.log" 2>&1 &
          pid=$!
          stop() {
            status=$?
            kill "$pid" 2>/dev/null || true
            [ "$status" -eq 0 ] || cat "$smoke/server.log"
          }
          trap stop EXIT
          .github/scripts/admin-ui-smoke.sh http://127.0.0.1:8080
          want="$(jq -r .version version.json)"
          got="$(curl -fsS http://127.0.0.1:8080/health | jq -r .version)"
          if [ "$got" != "$want" ]; then
            echo "::error::The binary reports version $got, version.json says $want"
            exit 1
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: kiro-proxy-binaries
          path: ${{ runner.temp }}/release
          retention-days: 7
          if-no-files-found: error
          # The archives are compressed already.
          compression-level: 0

  # Only this job holds a write token, and it runs no project code: the build above, with its
  # package installs, gets read access only.
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A main push and a hand-pushed tag for one version publish one after the other.
    concurrency:
      group: release-publish-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: kiro-proxy-binaries
          path: ${{ runner.temp }}/release

      # A first run creates the release with the changelog from version.json. A re-run replaces
      # the assets and leaves the notes alone, in case they were edited on GitHub since.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/release/kiro-proxy-* "$RUNNER_TEMP/release/SHA256SUMS.txt")
          if [ "${#assets[@]}" -ne 7 ]; then
            echo "::error::Expected 6 archives and SHA256SUMS.txt, found ${#assets[@]} files"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi

          notes="$RUNNER_TEMP/notes.md"
          {
            jq -r '.changelog | split("\n") | map(select(length > 0) | "- " + .) | .[]' version.json
            echo
            echo "Check a download against the checksums with \`sha256sum -c SHA256SUMS.txt --ignore-missing\` (macOS: \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`)."
            echo
            echo "Docker image: \`ghcr.io/${GH_REPO,,}:${TAG#v}\`"
          } >"$notes"

          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if [ "$REF_TYPE" = tag ]; then
            flags+=(--verify-tag)
          else
            # The release creates the tag on the commit that was built.
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${assets[@]}" --title "Kiro Proxy $TAG" \
            --notes-file "$notes" "${flags[@]}"

          # A tag made with GITHUB_TOKEN starts no workflow, so start the Docker build for it here;
          # its semver rules read the tag ref and push the <version> and <major>.<minor> images.
          if [ "$REF_TYPE" != tag ]; then
            gh workflow run docker.yml --ref "$TAG"
          fi
