name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A whole run takes about seven minutes; a network stall fails it here instead of after six hours.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The pnpm version comes from the packageManager field; there is no root package.json.
          package_json_file: ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Lint UI
        working-directory: ui
        run: pnpm lint

      - name: Typecheck UI
        working-directory: ui
        run: pnpm typecheck

      - name: Test UI
        working-directory: ui
        run: pnpm test

      # Build the UI before Go so the binary embeds ui/dist.
      - name: Build UI
        working-directory: ui
        run: pnpm build

      # The Playwright suites (smoke, shell, accounts and locale layout, pseudo-locale) run against
      # the mock-mode dev server that playwright.config.ts starts on its own port (6391).
      # The runner image already carries Chrome's system libraries, so the browser installs on its
      # own and apt runs only when a test launch says a library is missing: an Ubuntu mirror
      # outage (apt failing to resolve archive.ubuntu.com) no longer fails the build.
      - name: Install Playwright Chromium
        working-directory: ui
        timeout-minutes: 10
        run: |
          pnpm exec playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            pnpm exec playwright install-deps chromium
          fi

      - name: E2E UI
        working-directory: ui
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: ui/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go
        run: go build ./...

      - name: Test Go
        run: go test ./...
