name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

# A new push to a pull request cancels the run of its older commit. A push to a branch gets a group
# of its own, so it never waits for or cancels another: every commit that lands gets a full run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

# Each job runs one part of the suite, all at once, so the run takes as long as its slowest job.
# Every job runs the whole of its part on every push: nothing is skipped for an unchanged path.
jobs:
  ui-checks:
    name: UI lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the UI
        uses: ./.github/actions/setup-ui

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Typecheck UI
        working-directory: ui
        run: npm run typecheck

      - name: Build UI
        working-directory: ui
        run: npm run build

  ui-unit:
    name: UI unit tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # A failure in one shard still lets the others finish, so one run reports every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the UI
        uses: ./.github/actions/setup-ui

      # The shards split the files by their recorded run time (ui/vitest-timings.ts), and each
      # file runs in exactly one shard. One worker per core: the runner does nothing else meanwhile.
      - name: Test UI
        working-directory: ui
        run: npm test -- --shard=${{ matrix.shard }}/5 --maxWorkers=100%

  ui-e2e:
    name: UI e2e tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the UI
        uses: ./.github/actions/setup-ui

      - name: Read the Playwright version
        id: playwright
        working-directory: ui
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # The Playwright suites (smoke, shell, accounts and locale layout, pseudo-locale) run against
      # the mock-mode dev server that playwright.config.ts starts on its own port (6391).
      # The runner image already carries Chrome's system libraries, so the browser installs on its
      # own and apt runs only when a test launch says a library is missing: an Ubuntu mirror
      # outage (apt failing to resolve archive.ubuntu.com) no longer fails the build.
      - name: Install Playwright Chromium
        working-directory: ui
        timeout-minutes: 10
        run: |
          npx --no-install playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            npx --no-install playwright install-deps chromium
          fi

      - name: Save Playwright Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: E2E UI
        working-directory: ui
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: ui/test-results
          retention-days: 7
          if-no-files-found: ignore

  go:
    name: Go build and test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # ui/dist holds only its committed placeholder here; ui-checks builds the real UI.
      - name: Build Go
        run: go build ./...

      # The proxy package alone takes about 40 seconds, so its tests split across the shards by
      # name; each test runs in exactly one shard.
      - name: Test Go
        run: .github/scripts/go-test-shard.sh ${{ matrix.shard }} 2

  # The public-link helper is its own module on a newer Go, with its own toolchain and cache.
  tunnel-helper:
    name: Tunnel helper vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: helper/kiro-tunnel/go.mod
          cache-dependency-path: helper/kiro-tunnel/go.sum

      - name: Vet tunnel helper
        working-directory: helper/kiro-tunnel
        run: go vet ./...

      - name: Test tunnel helper
        working-directory: helper/kiro-tunnel
        run: go test ./...
